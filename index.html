<style>
:root{--ink:#251f21;--ink2:#585254;--line:#eae9ea;--teal:#4f8f7f;--bg:#fdfcfb;--sand:#f4efec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 20px 40px}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:22px;letter-spacing:.08em;margin-bottom:16px}
.brand img{width:56px;height:56px;border-radius:50%}
.gallery{background:var(--sand);border-radius:24px;overflow:hidden}
.gallery img{display:block;width:100%;height:auto;max-height:560px;object-fit:cover;object-position:center 30%}
h1{font-size:28px;font-weight:600;margin:20px 0 4px}
.price{color:var(--teal);font-weight:700;font-size:22px;margin:0 0 12px}
h2{font-size:20px;font-weight:600;margin:28px 0 12px}
.lbl{color:var(--ink2);margin:16px 0 6px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:56px;justify-content:center;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);font-weight:700}
.dot{width:18px;height:18px;border-radius:50%;border:1px solid var(--line)}
label{display:block;color:var(--ink2);font-size:14px;margin-top:16px}
input,textarea{display:block;width:100%;margin-top:6px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;color:var(--ink);background:#fff}
.qty{display:flex;align-items:center;gap:16px;margin-top:6px}
.qty button{width:44px;height:44px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:20px;cursor:pointer}
.qty b{min-width:24px;text-align:center;color:var(--ink)}
.total{margin:20px 0 12px}
.order{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:6px;border:0;background:var(--ink);color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.order[aria-disabled=true]{background:var(--sand);color:var(--ink2);border:1px solid var(--line);cursor:not-allowed}
.note{margin:16px 0 0;padding:4px 14px;border-inline-start:2px solid var(--line);color:var(--ink2);font-size:14px}
.note b{color:var(--ink)}
footer{margin-top:28px;color:var(--ink2);font-size:14px;text-align:center}
</style>
</head>

var sizes=["S","M","L","XL"];
var st={color:colors[0],size:"",qty:1};
var $=function(i){return document.getElementById(i)};
function chip(parent,text,sw,fn){var b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("aria-pressed","false");if(sw){var d=document.createElement("span");d.className="dot";d.style.background=sw;b.appendChild(d)}b.appendChild(document.createTextNode(text));b.onclick=fn;parent.appendChild(b);return b}
var cb=colors.map(function(c,i){return chip($("colors"),c.name,c.sw,function(){st.color=c;update()})});
var sb=sizes.map(function(s){return chip($("sizes"),s,null,function(){st.size=s;update()})});
$("minus").onclick=function(){st.qty=Math.max(1,st.qty-1);update()};
$("plus").onclick=function(){st.qty=Math.min(10,st.qty+1);update()};
["name","phone","address"].forEach(function(i){$(i).oninput=update});
function update(){
 cb.forEach(function(b,i){b.setAttribute("aria-pressed",colors[i]===st.color)});
 sb.forEach(function(b,i){b.setAttribute("aria-pressed",sizes[i]===st.size)});
 $("photo").src=st.color.img;$("photo").alt=st.color.alt;
 $("qty").textContent=st.qty;
 var total=PRICE*st.qty;$("total").textContent=total+" جنيه";
 var n=$("name").value.trim(),p=$("phone").value.trim(),a=$("address").value.trim();
 var o=$("order");
 if(st.size&&n&&p&&a){
  var msg=["طلب جديد من ELDA7","اللون: "+st.color.name,"المقاس: "+st.size,"العدد: "+st.qty,"الإجمالى: "+total+" جنيه","الاسم: "+n,"رقم الموبايل: "+p,"العنوان: "+a].join("\n");
  o.href="https://wa.me/"+WA+"?text="+encodeURIComponent(msg);o.setAttribute("aria-disabled","false");o.textContent="ابعت الطلب على واتساب";
 }else{o.removeAttribute("href");o.setAttribute("aria-disabled","true");o.textContent="اختار المقاس واملا بياناتك الأول"}
}
$("order").onclick=function(e){if(this.getAttribute("aria-disabled")==="true")e.preventDefault()};
update();
