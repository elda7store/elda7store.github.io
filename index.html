<style>
:root{--ink:#251f21;--ink2:#585254;--line:#eae9ea;--teal:#4f8f7f;--bg:#fdfcfb;--sand:#f4efec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:20px;letter-spacing:.08em}
.logo img{width:40px;height:40px;border-radius:50%}
.cartlink{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:22px;background:#fff;text-decoration:none;font-weight:600}
.cartlink b{margin-inline-start:6px;background:var(--ink);color:#fff;border-radius:11px;min-width:22px;height:22px;line-height:22px;text-align:center;font-size:13px}
nav{max-width:1000px;margin:0 auto;padding:0 16px 8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:20px;background:#fff;text-decoration:none}
nav a[aria-current=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:26px;font-weight:600;margin:8px 0 12px}
h2{font-size:20px;font-weight:600;margin:24px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
.card{display:block;text-decoration:none}
.ph{background:var(--sand);border-radius:16px;overflow:hidden;aspect-ratio:3/4}
.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.nm{margin:8px 0 0;font-weight:600}
.pr{color:var(--teal);font-weight:700}
.dots{display:flex;gap:4px;margin-top:2px}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);display:inline-block}
.empty{color:var(--ink2);text-align:center;padding:40px 0}
.hero{background:var(--sand);border-radius:20px;padding:24px 20px;margin-bottom:8px}
.hero p{margin:4px 0 0;color:var(--ink2)}
.pwrap{display:grid;gap:16px}
@media(min-width:720px){.pwrap{grid-template-columns:1fr 1fr;gap:32px;align-items:start}}
.gallery{background:var(--sand);border-radius:20px;overflow:hidden}
.gallery img{display:block;width:100%;height:auto;max-height:600px;object-fit:cover;object-position:center 30%}
.price{color:var(--teal);font-weight:700;font-size:21px;margin:0 0 8px}
.lbl{color:var(--ink2);margin:14px 0 6px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:56px;justify-content:center;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);font-weight:700}
label{display:block;color:var(--ink2);font-size:14px;margin-top:14px}
input,textarea{display:block;width:100%;margin-top:6px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;color:var(--ink);background:#fff}
.qty{display:inline-flex;align-items:center;gap:12px}
.qty button{width:44px;height:44px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:20px;cursor:pointer;color:var(--ink)}
.qty b{min-width:22px;text-align:center;color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:16px;border-radius:6px;border:0;background:var(--ink);color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn[aria-disabled=true]{background:var(--sand);color:var(--ink2);border:1px solid var(--line);cursor:not-allowed}
.msg{color:var(--teal);font-weight:600;margin-top:10px;min-height:24px}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item img{width:72px;height:92px;object-fit:cover;object-position:center 30%;border-radius:10px;background:var(--sand)}
.item .meta{color:var(--ink2);font-size:14px}
.rm{border:0;background:none;color:var(--ink2);text-decoration:underline;font:inherit;cursor:pointer;min-height:44px;padding:0}
.sum{display:flex;justify-content:space-between;padding:14px 0;font-size:18px}
.note{margin:14px 0 0;color:var(--ink2);font-size:14px}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--ink2);text-decoration:none}
footer{text-align:center;color:var(--ink2);font-size:14px;padding:16px 16px 40px}
</style>
</head>

<script>
fetch("products.json?v="+Date.now()).then(function(r){if(!r.ok)throw 1;return r.json()}).then(function(DATA){
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var CUR=DATA.currency;
var cart=[];try{cart=JSON.parse(localStorage.getItem("elda7cart")||"[]")}catch(e){}
function save(){try{localStorage.setItem("elda7cart",JSON.stringify(cart))}catch(e){}$("cc").textContent=cart.reduce(function(s,i){return s+i.qty},0)}
function prod(id){return DATA.products.filter(function(p){return p.id===id})[0]}
function pcolor(p,n){return p.colors.filter(function(c){return c.name===n})[0]||p.colors[0]}
function inCats(){return DATA.categories.filter(function(c){return DATA.products.some(function(p){return p.category===c.id})})}
function menu(active){var m=$("menu");m.innerHTML="";var cs=inCats();if(cs.length<2){m.style.display="none";return}m.style.display="";
 var all=el("a","","الكل");all.href="#/";all.setAttribute("aria-current",active==="all");m.appendChild(all);
 cs.forEach(function(c){var a=el("a","",c.name);a.href="#/c/"+c.id;a.setAttribute("aria-current",active===c.id);m.appendChild(a)})}
function card(p){var a=el("a","card");a.href="#/p/"+p.id;var ph=el("div","ph"),im=el("img");im.src=p.colors[0].image;im.alt=p.name;im.loading="lazy";ph.appendChild(im);a.appendChild(ph);
 a.appendChild(el("div","nm",p.name));a.appendChild(el("div","pr",p.price+" "+CUR));
 if(p.colors.length>1){var d=el("div","dots");p.colors.forEach(function(c){var s=el("span","dot");s.style.background=c.swatch;d.appendChild(s)});a.appendChild(d)}return a}
function home(catId){var app=$("app");app.innerHTML="";
 if(!catId){var h=el("div","hero");h.appendChild(el("h1","","أهلا بيك فى "+DATA.brand));h.appendChild(el("p","","اختار المنتج وكمل الطلب على واتساب."));app.appendChild(h)}
 else{var c=DATA.categories.filter(function(x){return x.id===catId})[0];app.appendChild(el("h1","",c?c.name:""))}
 var ps=DATA.products.filter(function(p){return !catId||p.category===catId});
 if(!ps.length){app.appendChild(el("p","empty","مفيش منتجات هنا دلوقتى."));return}
 var g=el("div","grid");ps.forEach(function(p){g.appendChild(card(p))});app.appendChild(g)}
function product(id){var p=prod(id),app=$("app");app.innerHTML="";if(!p){location.hash="#/";return}
 var st={color:p.colors[0],size:"",qty:1};
 var back=el("a","back","← رجوع");back.href="#/c/"+p.category;if(inCats().length<2)back.href="#/";app.appendChild(back);
 var w=el("div","pwrap");var gal=el("div","gallery"),im=el("img");gal.appendChild(im);w.appendChild(gal);
 var side=el("div");side.appendChild(el("h1","",p.name));side.appendChild(el("p","price",p.price+" "+CUR));
 var cw=el("div"),cch=el("div","chips"),cb=[],sb=[];
 if(p.colors.length>1){cw.appendChild(el("div","lbl","اللون"));cw.appendChild(cch);side.appendChild(cw)}
 var sw=el("div"),sch=el("div","chips");
 if(p.sizes&&p.sizes.length){sw.appendChild(el("div","lbl","المقاس"));sw.appendChild(sch);side.appendChild(sw)}
 function chip(par,t,sc,fn){var b=el("button","chip");b.type="button";b.setAttribute("aria-pressed","false");if(sc){var d=el("span","dot");d.style.background=sc;b.appendChild(d)}b.appendChild(document.createTextNode(t));b.onclick=fn;par.appendChild(b);return b}
 cb=p.colors.map(function(c){return chip(cch,c.name,c.swatch,function(){st.color=c;upd()})});
 sb=(p.sizes||[]).map(function(s){return chip(sch,s,null,function(){st.size=s;upd()})});
 side.appendChild(el("div","lbl","العدد"));var q=el("div","qty"),mi=el("button","","-"),qn=el("b","","1"),pl=el("button","","+");mi.type=pl.type="button";mi.setAttribute("aria-label","قلل العدد");pl.setAttribute("aria-label","زود العدد");q.appendChild(mi);q.appendChild(qn);q.appendChild(pl);side.appendChild(q);
 mi.onclick=function(){st.qty=Math.max(1,st.qty-1);upd()};pl.onclick=function(){st.qty=Math.min(10,st.qty+1);upd()};
 var add=el("button","btn","ضيف للسلة");add.type="button";side.appendChild(add);
 var msg=el("div","msg");msg.setAttribute("role","status");side.appendChild(msg);
 var go=el("a","btn alt","روح للسلة");go.href="#/cart";side.appendChild(go);
 w.appendChild(side);app.appendChild(w);
 function upd(){cb.forEach(function(b,i){b.setAttribute("aria-pressed",p.colors[i]===st.color)});sb.forEach(function(b,i){b.setAttribute("aria-pressed",p.sizes[i]===st.size)});im.src=st.color.image;im.alt=p.name+" "+st.color.name;qn.textContent=st.qty;msg.textContent=""}
 add.onclick=function(){if(p.sizes&&p.sizes.length&&!st.size){msg.textContent="اختار المقاس الأول";return}
  var ex=cart.filter(function(i){return i.id===p.id&&i.color===st.color.name&&i.size===st.size})[0];
  if(ex)ex.qty=Math.min(10,ex.qty+st.qty);else cart.push({id:p.id,color:st.color.name,size:st.size,qty:st.qty});
  save();upd();msg.textContent="اتضاف للسلة ✓"};
 upd()}
function cartPage(){var app=$("app");app.innerHTML="";app.appendChild(el("h1","","السلة"));
 cart=cart.filter(function(i){return prod(i.id)});
 if(!cart.length){app.appendChild(el("p","empty","السلة فاضية."));var b=el("a","btn alt","كمل تسوق");b.href="#/";app.appendChild(b);save();return}
 var total=0;
 cart.forEach(function(it,idx){var p=prod(it.id),c=pcolor(p,it.color);total+=p.price*it.qty;
  var r=el("div","item"),im=el("img");im.src=c.image;im.alt=p.name;r.appendChild(im);
  var m=el("div");m.appendChild(el("div","nm",p.name));var meta=[];if(p.colors.length>1)meta.push(it.color);if(it.size)meta.push("المقاس "+it.size);meta.push(p.price+" "+CUR);m.appendChild(el("div","meta",meta.join(" • ")));
  var q=el("div","qty"),mi=el("button","","-"),qn=el("b","",it.qty),pl=el("button","","+");mi.type=pl.type="button";mi.setAttribute("aria-label","قلل العدد");pl.setAttribute("aria-label","زود العدد");q.appendChild(mi);q.appendChild(qn);q.appendChild(pl);m.appendChild(q);
  mi.onclick=function(){it.qty=Math.max(1,it.qty-1);save();cartPage()};pl.onclick=function(){it.qty=Math.min(10,it.qty+1);save();cartPage()};
  r.appendChild(m);var rm=el("button","rm","شيل");rm.type="button";rm.onclick=function(){cart.splice(idx,1);save();cartPage()};r.appendChild(rm);app.appendChild(r)});
